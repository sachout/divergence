name: Scan divergences RSI

on:
  schedule:
    - cron: "0 22 * * 1-5"   # lundi-vendredi, après la clôture de Wall Street
  workflow_dispatch:          # permet de lancer le scan à la main

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Europe/Paris        # heure affichée sur la page
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scanner_divergences_rsi.py --out index.html --no-open
      - name: Publier la page
        run: |
          git config user.name "scan-bot"
          git config user.email "scan-bot@users.noreply.github.com"
          git add index.html
          git commit -m "Scan du $(date +'%d/%m/%Y %H:%M')" || echo "rien à publier"
          git push
